[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino

; Set CPU frequency to 160MHz
board_build.f_cpu = 160000000L

; Monitor settings
monitor_speed = 115200

; Library dependencies
lib_deps = 
    bodmer/TFT_eSPI@^2.5.43
    XPT2046_Touchscreen

; Build flags for TFT_eSPI user setup
build_flags = 
    -D USER_SETUP_LOADED=1
    -D ILI9341_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=0
    -D TFT_RST=2
    -D TOUCH_CS=4
    -D SUPPORT_TRANSACTIONS=1
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D SPI_FREQUENCY=40000000
    -D SPI_READ_FREQUENCY=20000000
    -D SPI_TOUCH_FREQUENCY=2500000